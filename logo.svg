<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2463"/>
      <stop offset="100%" stop-color="#1e88e5"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e3f2fd"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Outer gear ring -->
  <g transform="translate(200,200)" fill="none" stroke="url(#gearGrad)" stroke-width="8">
    <!-- Gear teeth -->
    <path d="M0 -130 L0 -145 M91.9 -91.9 L102.5 -102.5 M130 0 L145 0 M91.9 91.9 L102.5 102.5 M0 130 L0 145 M-91.9 91.9 L-102.5 102.5 M-130 0 L-145 0 M-91.9 -91.9 L-102.5 -102.5" stroke-linecap="round"/>
    <!-- Inner circle of gear -->
    <circle cx="0" cy="0" r="120" stroke-dasharray="15 10"/>
    <circle cx="0" cy="0" r="100" stroke="url(#gearGrad)" stroke-width="3" opacity="0.5"/>
  </g>
  <!-- Hexagon inner shape -->
  <polygon points="200,70 295,125 295,240 200,295 105,240 105,125" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
  <!-- Sun (solar panel icon) -->
  <circle cx="200" cy="180" r="35" fill="url(#sunGrad)" opacity="0.9"/>
  <g stroke="#ffd54f" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="200" y1="130" x2="200" y2="140"/>
    <line x1="200" y1="220" x2="200" y2="230"/>
    <line x1="150" y1="180" x2="160" y2="180"/>
    <line x1="240" y1="180" x2="250" y2="180"/>
    <line x1="165" y1="145" x2="172" y2="152"/>
    <line x1="228" y1="208" x2="235" y2="215"/>
    <line x1="165" y1="215" x2="172" y2="208"/>
    <line x1="228" y1="152" x2="235" y2="145"/>
  </g>
  <!-- Lightning bolt (electricity) -->
  <path d="M185 230 L195 230 L190 255 L205 255 L185 290 L195 270 L180 270 Z" fill="#fff" opacity="0.9"/>
  <!-- Company initials -->
  <text x="200" y="340" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="36" letter-spacing="3">I&amp;S</text>
</svg>
